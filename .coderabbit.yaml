# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Be concise and specific. Prefer actionable fixes over general advice."

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Skip generated, binary and vendored files so reviews stay focused.
  path_filters:
    - "!**/*.import"
    - "!.godot/**"
    - "!build/**"
    - "!steam/output/**"
    - "!steam/content/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.ogg"
    - "!**/*.wav"
    - "!**/*.glb"
    - "!**/*.pck"
    - "!**/*.uid"
    - "!addons/godotsteam/**"

  path_instructions:
    - path: "scripts/**/*.gd"
      instructions: |
        Review GDScript for correctness and performance.
        - Game logic must not depend on UI nodes or on Steam directly.
        - Flag per-frame allocations, node-tree searches in _process/_physics_process,
          and untyped variables on hot paths.
        - Flag signals that are connected but never disconnected on freed nodes.
        - Randomness must go through a seedable RandomNumberGenerator so tests are deterministic.
    - path: "scripts/steam/**"
      instructions: |
        Steam safety review.
        - Every Steam call must go through SteamService and must be safe when Steam is
          unavailable (no crash, sensible fallback).
        - The App ID must come from the single config value, never hard-coded.
        - No credentials, tokens or user identifiers in logs or in the repo.
        - Validate all data received from other players or from Steam before using it.
    - path: "data/**/*.json"
      instructions: |
        Check game data for schema consistency, duplicate ids, negative or zero values
        that should not exist, and balance outliers (price, HP, spawn chance).
    - path: "tests/**"
      instructions: |
        Tests must be deterministic (seeded RNG), headless-safe and independent of Steam.
    - path: ".github/workflows/**"
      instructions: |
        Check that actions are pinned to a version, permissions are least-privilege,
        and no secrets are printed or required for pull requests from forks.
    - path: "steam/**"
      instructions: |
        SteamPipe scripts must not contain credentials. Flag any hard-coded account names
        or passwords.

chat:
  auto_reply: true
